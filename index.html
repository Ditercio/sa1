
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Inteligente: Economize até 40% no seu Seguro Auto</title>
    <meta name="description" content="Descubra 7 estratégias exclusivas para economizar até 40% no seu Seguro Auto sem abrir mão da proteção. Baixe nosso Guia Inteligente gratuito agora!">
    <link rel="stylesheet" href="style.css">
    <!-- Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Guia Inteligente de Economia Seguro Auto",
      "description": "7 estratégias para economizar até 40% no seguro auto."
    }
    </script>
</head>
<body>

    <header>
        <div class="container">
            <h1>Descubra como economizar até 40% no seu Seguro Auto</h1>
            <p class="subtitle">Baixe o Guia Inteligente e aprenda as estratégias que as seguradoras não contam.</p>
        </div>
    </header>

    <main class="container">
        <section id="hero">
            <div class="content">
                <h2>Proteção completa, preço justo.</h2>
                <ul class="benefits">
                    <li>✓ Sem abrir mão da segurança</li>
                    <li>✓ Passo a passo simplificado</li>
                    <li>✓ Linguagem acessível</li>
                </ul>
            </div>
            <div class="form-wrapper">
                <form id="leadForm" action="obrigado.html">
                    <input type="text" placeholder="Nome completo" required aria-label="Nome">
                    <input type="email" placeholder="Seu melhor e-mail" required aria-label="Email">
                    <input type="tel" placeholder="Telefone (WhatsApp)" required aria-label="Telefone">
                    
                    <div class="qualify">
                        <label>Quando pretende contratar?</label>
                        <select required>
                            <option value="">Selecione...</option>
                            <option>Hoje</option>
                            <option>Esta semana</option>
                            <option>Este mês</option>
                            <option>Ainda pesquisando</option>
                        </select>
                        <!-- Outras perguntas simplificadas para exemplo -->
                    </div>
                    
                    <label><input type="checkbox" required> Aceito a <a href="#">Política de Privacidade (LGPD)</a></label>
                    <button type="submit" class="cta-button">Quero baixar gratuitamente</button>
                </form>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
