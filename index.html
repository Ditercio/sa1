<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economize no seu Seguro Auto</title>
    <!-- Adicione seu link de CSS aqui -->
</head>
<body>

    <header>
        <div>
            <h1>Descubra como economizar até 40% no seu Seguro Auto</h1>
            <p>Baixe o Guia Inteligente e aprenda as estratégias que as seguradoras não contam.</p>
        </div>
    </header>

    <main>
        <section>
            <div>
                <h2>Proteção completa, preço justo.</h2>
                <ul>
                    <li>✓ Sem abrir mão da segurança</li>
                    <li>✓ Passo a passo simplificado</li>
                    <li>✓ Linguagem acessível</li>
                </ul>
            </div>

            <!-- Formulário com IDs definidos -->
            <form id="leadForm">
                <input type="text" id="nome" placeholder="Seu nome" required>
                <input type="email" id="email" placeholder="Seu e-mail" required>
                <input type="tel" id="telefone" placeholder="Seu telefone" required>
                
                <label for="intencaoCompra">Quando pretende contratar?</label>
                <select id="intencaoCompra" name="intencao" required>
                    <option value="">Selecione...</option>
                    <option value="Hoje">Hoje</option>
                    <option value="Esta semana">Esta semana</option>
                    <option value="Este mês">Este mês</option>
                    <option value="Ainda pesquisando">Ainda pesquisando</option>
                </select>

                <button type="submit">Quero baixar gratuitamente</button>
            </form>
        </section>
    </main>

    <!-- Certifique-se de que o script.js está sendo chamado -->
    <script src="script.js"></script>
</body>
</html>
